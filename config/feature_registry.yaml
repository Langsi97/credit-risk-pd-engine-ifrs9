# Engineered features (added in Phase 3). Each one lists the raw columns it is computed from;
# the registry checks that every input is a candidate, so a leak cannot sneak in through a
# derived feature. Example:
#   instalment_to_income: {inputs: [Amount, LoanDuration, IncomeTotal], note: "..."}
derived: {}
